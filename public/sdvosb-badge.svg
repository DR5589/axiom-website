<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="#0A1628" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#8B1A1A" stroke-width="3"/>

  <!-- Top curved text: CERTIFIED -->
  <defs>
    <path id="topCurve" d="M 30 100 A 70 70 0 0 1 170 100" fill="none"/>
    <path id="bottomCurve" d="M 35 115 A 65 65 0 0 0 165 115" fill="none"/>
  </defs>

  <text fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4">
    <textPath href="#topCurve" startOffset="50%" text-anchor="middle">CERTIFIED</textPath>
  </text>

  <!-- Bottom curved text: SERVICE-DISABLED VETERAN-OWNED -->
  <text fill="#FFFFFF" font-family="Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1.5">
    <textPath href="#bottomCurve" startOffset="50%" text-anchor="middle">SERVICE-DISABLED VETERAN-OWNED</textPath>
  </text>

  <!-- Center star -->
  <g transform="translate(100, 85)">
    <polygon points="0,-22 6,-7 22,-7 9,3 14,18 0,9 -14,18 -9,3 -22,-7 -6,-7" fill="#8B1A1A" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- SDVOSB text center -->
  <text x="100" y="125" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="2">SDVOSB</text>

  <!-- Small business tag -->
  <text x="100" y="142" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="7" font-weight="600" text-anchor="middle" letter-spacing="2" opacity="0.8">SMALL BUSINESS</text>
</svg>
